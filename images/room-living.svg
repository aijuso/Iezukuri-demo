<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e4cf"/><stop offset="1" stop-color="#e8d5b8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2a86f"/><stop offset="1" stop-color="#b98a52"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6e0"/><stop offset="1" stop-color="#a9cbb6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" fill="url(#wall)"/>
  <!-- ceiling beams -->
  <rect width="800" height="70" fill="#caa779"/>
  <g stroke="#a8814f" stroke-width="6"><line x1="120" y1="0" x2="120" y2="70"/><line x1="300" y1="0" x2="300" y2="70"/></g>
  <!-- floor -->
  <rect y="330" width="800" height="130" fill="url(#floor)"/>
  <g stroke="#a8814f" stroke-width="2" opacity="0.5">
    <line x1="0" y1="365" x2="800" y2="365"/><line x1="0" y1="405" x2="800" y2="405"/><line x1="0" y1="440" x2="800" y2="440"/>
  </g>
  <!-- large window with garden -->
  <rect x="360" y="80" width="360" height="270" fill="url(#glass)"/>
  <g fill="#8bb583"><circle cx="430" cy="250" r="36"/><circle cx="470" cy="230" r="44"/><rect x="450" y="250" width="14" height="60"/></g>
  <g stroke="#f4ead7" stroke-width="10"><line x1="540" y1="80" x2="540" y2="350"/><line x1="360" y1="200" x2="720" y2="200"/></g>
  <rect x="360" y="80" width="360" height="270" fill="none" stroke="#9c7a4c" stroke-width="10"/>
  <!-- shelves left -->
  <rect x="40" y="120" width="120" height="210" fill="#e7d2b2"/>
  <g stroke="#c2a274" stroke-width="6"><line x1="40" y1="180" x2="160" y2="180"/><line x1="40" y1="250" x2="160" y2="250"/></g>
  <circle cx="70" cy="150" r="9" fill="#8bb583"/><rect x="100" y="140" width="14" height="30" fill="#cf9b5e"/>
  <!-- pendant light -->
  <line x1="300" y1="0" x2="300" y2="90" stroke="#6b522f" stroke-width="3"/>
  <path d="M282 90 h36 l-8 26 h-20Z" fill="#f6e7c4" stroke="#caa86a" stroke-width="2"/>
  <!-- dining table -->
  <ellipse cx="250" cy="372" rx="150" ry="26" fill="#caa06a"/>
  <rect x="110" y="300" width="280" height="74" rx="10" fill="#d9b27a"/>
  <rect x="120" y="370" width="12" height="60" fill="#b78a52"/><rect x="368" y="370" width="12" height="60" fill="#b78a52"/>
  <!-- chairs -->
  <rect x="90" y="320" width="14" height="90" rx="5" fill="#b88a50"/>
  <rect x="396" y="320" width="14" height="90" rx="5" fill="#b88a50"/>
  <!-- table plant -->
  <rect x="240" y="288" width="20" height="16" fill="#e8dcc2"/>
  <g fill="#7fae6f"><circle cx="244" cy="284" r="8"/><circle cx="256" cy="282" r="9"/><circle cx="250" cy="276" r="8"/></g>
  <!-- big floor plant -->
  <rect x="650" y="350" width="46" height="40" rx="6" fill="#d9b98c"/>
  <g fill="#6fa05f"><ellipse cx="660" cy="320" rx="16" ry="34"/><ellipse cx="685" cy="320" rx="16" ry="34"/><ellipse cx="673" cy="305" rx="14" ry="36"/></g>
</svg>
