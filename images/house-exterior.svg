<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6ef"/><stop offset="1" stop-color="#e8f0e4"/></linearGradient>
  </defs>
  <rect width="800" height="460" fill="url(#sky)"/>
  <!-- ground -->
  <rect y="330" width="800" height="130" fill="#cdbf96"/>
  <ellipse cx="400" cy="340" rx="430" ry="40" fill="#bcd49a"/>
  <!-- trees behind -->
  <g fill="#7fae6f"><circle cx="60" cy="250" r="46"/><circle cx="740" cy="240" r="54"/></g>
  <!-- modern flat-roof house -->
  <rect x="180" y="200" width="440" height="150" fill="#5a4a3a"/>
  <rect x="160" y="186" width="480" height="22" fill="#42352a"/>
  <!-- wood section -->
  <rect x="180" y="200" width="150" height="150" fill="#b07b44"/>
  <g stroke="#9a6a39" stroke-width="3"><line x1="180" y1="230" x2="330" y2="230"/><line x1="180" y1="260" x2="330" y2="260"/><line x1="180" y1="290" x2="330" y2="290"/><line x1="180" y1="320" x2="330" y2="320"/></g>
  <!-- large glass -->
  <rect x="345" y="216" width="255" height="134" fill="#bcd6da"/>
  <g stroke="#403424" stroke-width="6"><line x1="430" y1="216" x2="430" y2="350"/><line x1="515" y1="216" x2="515" y2="350"/></g>
  <g fill="#8bb583" opacity="0.7"><circle cx="470" cy="300" r="20"/></g>
  <!-- entrance -->
  <rect x="610" y="250" width="10" height="100" fill="#2f2519"/>
  <!-- foreground plants -->
  <g fill="#6fa05f"><ellipse cx="130" cy="360" rx="40" ry="20"/><ellipse cx="690" cy="370" rx="60" ry="22"/></g>
  <g fill="#7cb06a"><path d="M150 360 q-6 -40 8 -60 q14 20 8 60Z"/><path d="M120 360 q-10 -34 4 -54 q12 22 6 54Z"/></g>
</svg>
