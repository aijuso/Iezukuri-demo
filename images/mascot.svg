<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <!-- raised arm -->
  <path d="M150 118 q26 -10 30 -34 q3 -14 -8 -16 q-9 -1 -12 12 q-3 14 -18 22Z" fill="#b6753c"/>
  <!-- body -->
  <ellipse cx="96" cy="150" rx="60" ry="62" fill="#c08344"/>
  <!-- belly -->
  <ellipse cx="96" cy="158" rx="40" ry="46" fill="#e9cda0"/>
  <!-- left arm holding clipboard -->
  <ellipse cx="52" cy="150" rx="16" ry="22" fill="#b6753c"/>
  <!-- clipboard -->
  <g>
    <rect x="30" y="138" width="46" height="58" rx="6" fill="#f3e4c6" stroke="#b6753c" stroke-width="3"/>
    <rect x="44" y="132" width="18" height="10" rx="3" fill="#8a5a2b"/>
    <line x1="40" y1="156" x2="66" y2="156" stroke="#b6753c" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="168" x2="66" y2="168" stroke="#b6753c" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="180" x2="58" y2="180" stroke="#b6753c" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- feet -->
  <ellipse cx="74" cy="206" rx="14" ry="10" fill="#b6753c"/>
  <ellipse cx="116" cy="206" rx="14" ry="10" fill="#b6753c"/>
  <!-- head -->
  <ellipse cx="100" cy="92" rx="50" ry="46" fill="#c08344"/>
  <!-- ears -->
  <circle cx="64" cy="58" r="13" fill="#c08344"/>
  <circle cx="136" cy="58" r="13" fill="#c08344"/>
  <circle cx="64" cy="58" r="6" fill="#e9cda0"/>
  <circle cx="136" cy="58" r="6" fill="#e9cda0"/>
  <!-- cheeks/muzzle -->
  <ellipse cx="100" cy="104" rx="30" ry="24" fill="#efd9b4"/>
  <!-- eyes -->
  <circle cx="82" cy="86" r="6.5" fill="#3a2410"/>
  <circle cx="118" cy="86" r="6.5" fill="#3a2410"/>
  <circle cx="84" cy="84" r="2" fill="#fff"/>
  <circle cx="120" cy="84" r="2" fill="#fff"/>
  <!-- nose -->
  <ellipse cx="100" cy="100" rx="6" ry="4.5" fill="#5a3a1c"/>
  <path d="M100 104 v8 M100 112 q-7 5 -14 1 M100 112 q7 5 14 1" stroke="#5a3a1c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <!-- teeth -->
  <rect x="95" y="112" width="10" height="9" rx="2" fill="#fff" stroke="#d8c39c" stroke-width="1"/>
  <line x1="100" y1="112" x2="100" y2="121" stroke="#d8c39c" stroke-width="1"/>
  <!-- beanie -->
  <path d="M52 64 q4 -50 48 -50 q44 0 48 50 q-48 -16 -96 0Z" fill="#f0a93a"/>
  <path d="M52 64 q48 -16 96 0 l0 8 q-48 -15 -96 0Z" fill="#e2922a"/>
  <circle cx="100" cy="16" r="8" fill="#f6c66b"/>
</svg>
