<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="家づくりラボ — 実例から学べる、家づくりの判断支援メディア。">
  <title>家づくりラボ｜実例から学べる家づくりの判断支援メディア</title>
  <link rel="icon" href="images/logo-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ===== Header ===== -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a class="logo" href="#top" aria-label="家づくりラボ">
        <img class="logo__mark" src="images/logo-mark.svg" alt="">
        <span class="logo__text" data-logo></span>
        <svg class="logo__glass" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="#422700" stroke-width="2.4"/><line x1="15" y1="15" x2="21" y2="21" stroke="#422700" stroke-width="2.4" stroke-linecap="round"/></svg>
      </a>

      <nav class="nav" id="nav" aria-label="グローバルナビ">
        <ul class="nav__list" data-nav></ul>
      </nav>

      <button class="hamburger" id="hamburger" aria-label="メニューを開く" aria-expanded="false" aria-controls="nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top">
    <!-- ===== Hero ===== -->
    <section class="hero" id="hero">
      <div class="hero__bg" aria-hidden="true"></div>
      <div class="container hero__inner">
        <div class="hero__copy" data-hero-copy></div>
        <div class="hero__visual" data-hero-visual></div>
      </div>
      <div class="hero__wave" aria-hidden="true"></div>
    </section>

    <!-- ===== 悩みから探す ===== -->
    <section class="nayami" id="nayami">
      <div class="container nayami__inner">
        <div class="nayami__head" data-nayami-head></div>
        <div class="nayami__grid" data-nayami-grid></div>
      </div>
    </section>

    <!-- ===== 注目の実例 ===== -->
    <section class="examples" id="examples">
      <div class="container">
        <div class="section-head" data-examples-head></div>
        <div class="examples__panel">
          <div class="examples__featured" data-examples-featured></div>
          <div class="carousel">
            <button class="carousel__arrow carousel__arrow--prev" aria-label="前へ">&#10094;</button>
            <div class="carousel__viewport">
              <div class="carousel__track" data-examples-cards></div>
            </div>
            <button class="carousel__arrow carousel__arrow--next" aria-label="次へ">&#10095;</button>
          </div>
          <div class="carousel__dots" data-examples-dots></div>
        </div>
      </div>
    </section>

    <!-- ===== コラム & YouTube ===== -->
    <section class="media" id="column">
      <div class="container media__inner">
        <div class="media__col" data-column></div>
        <div class="media__col" id="youtube" data-youtube></div>
      </div>
    </section>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="footer__scene" aria-hidden="true"></div>
    <div class="container footer__inner" data-footer></div>
    <p class="footer__copy" data-footer-copy></p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
